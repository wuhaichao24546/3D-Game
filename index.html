<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云游修仙 · 3D 修仙游戏</title>
  <script type="module" crossorigin src="./assets/index-C-vRzyp_.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DJu8p_yG.css">
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="status-panel">
      <div id="realm-name">练气期 · 一层</div>
      <div id="exp-bar-wrap">
        <div id="exp-bar"></div>
        <span id="exp-text">0 / 100</span>
      </div>
      <div id="spirit-stones">灵石 × 0</div>
      <div id="time-of-day">☀ 辰时</div>
    </div>

    <div id="controls-hint">
      <b>操作</b>
      <span>WASD 移动</span>
      <span>鼠标 视角</span>
      <span>Shift 疾跑</span>
      <span>空格 跳跃 / 升高</span>
      <span>C 下降（飞行）</span>
      <span>F 御剑飞行</span>
      <span>Z 打坐修炼</span>
      <span>左键 剑气</span>
    </div>

    <div id="crosshair">·</div>
    <div id="banner"></div>
    <div id="lock-tip">点击画面锁定鼠标开始云游</div>
    <div id="loading">仙气汇聚中 · 载入资源…</div>
  </div>

</body>
</html>
